<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Reenji project atlas</title>
<desc id="desc">Four projects grouped into two themes: intelligent interfaces and systems research.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF7F0"/><stop offset="1" stop-color="#F0E9DD"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#176B87"/><stop offset="1" stop-color="#0A5875"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D94A59"/><stop offset="1" stop-color="#AD273A"/></linearGradient>
  <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.65" fill="#8E8579" opacity=".18"/></pattern>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#2E3B40" flood-opacity=".08"/></filter>
</defs>
<rect width="1200" height="430" rx="22" fill="url(#paper)"/>
<rect width="1200" height="430" rx="22" fill="url(#grain)"/>
<circle cx="1135" cy="60" r="130" fill="#176B87" opacity=".045"/>
<circle cx="65" cy="390" r="140" fill="#D94A59" opacity=".045"/>
<path d="M34 30H1166" stroke="#D7CCBD" stroke-width="1"/>
<text x="42" y="23" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2.6" font-weight="700" fill="#176B87">REENJI / PORTFOLIO INDEX</text>
<text x="1158" y="23" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.8" fill="#81776B">FOUR PROJECTS · TWO DIRECTIONS</text>
<text x="42" y="72" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#252A2C">A map of what I build.</text>
<text x="44" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#766D64">Different questions, different tools — connected by curiosity.</text>
<!-- left group -->
<g filter="url(#shadow)">
  <rect x="42" y="126" width="542" height="262" rx="16" fill="#FFFCF6" stroke="#DCD2C5"/>
  <rect x="42" y="126" width="542" height="7" rx="3.5" fill="url(#blue)"/>
  <text x="66" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2.3" font-weight="700" fill="#176B87">01 / INTELLIGENT INTERFACES</text>
  <path d="M74 198H550" stroke="#E9E0D5"/>
  <circle cx="81" cy="226" r="5" fill="#176B87"/>
  <text x="101" y="232" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#252A2C">ARGUS</text>
  <text x="101" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#766D64">Voice · context · desktop workflows</text>
  <path d="M101 270H550" stroke="#EEE5DA"/>
  <circle cx="81" cy="302" r="5" fill="#D94A59"/>
  <text x="101" y="308" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#252A2C">JARVIS</text>
  <text x="101" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#766D64">Personal assistant experiments</text>
  <text x="66" y="365" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.5" fill="#988C7D">BUILDING A MORE USEFUL DIGITAL WORKSPACE</text>
</g>
<!-- right group -->
<g filter="url(#shadow)">
  <rect x="616" y="126" width="542" height="262" rx="16" fill="#FFFCF6" stroke="#DCD2C5"/>
  <rect x="616" y="126" width="542" height="7" rx="3.5" fill="url(#red)"/>
  <text x="640" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2.3" font-weight="700" fill="#B93346">02 / SYSTEMS &amp; RESEARCH</text>
  <path d="M648 198H1124" stroke="#E9E0D5"/>
  <circle cx="655" cy="226" r="5" fill="#176B87"/>
  <text x="675" y="232" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#252A2C">AEGISNET-RED</text>
  <text x="675" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#766D64">Adversarial peer-to-peer security research</text>
  <path d="M675 270H1124" stroke="#EEE5DA"/>
  <circle cx="655" cy="302" r="5" fill="#D94A59"/>
  <text x="675" y="308" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#252A2C">GHOST</text>
  <text x="675" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#766D64">Linux-aware toolkit · modular CLI</text>
  <text x="640" y="365" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.5" fill="#988C7D">TOOLS THAT MAKE COMPLEXITY EASIER TO NAVIGATE</text>
</g>
<text x="42" y="414" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.5" fill="#81776B">PERSONAL PROJECTS / SOFTWARE / EXPERIMENTS</text>
<text x="1158" y="414" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.5" fill="#81776B">REENJI · 2026</text>
</svg>
