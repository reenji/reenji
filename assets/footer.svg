<text x="122.0" y="94" font-size="26" font-weight="700" fill="#39FF14" textLength="756.0" lengthAdjust="spacing">BUT EVERY SYSTEM LEAVES A FOOTPRINT.</text>
<text x="348.0" y="122" font-size="13" font-style="italic" fill="#8B949E" textLength="304.0" lengthAdjust="spacing">against the world. beyond the surface.</text>
