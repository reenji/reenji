<title id="t">reenji — AI engineering, cybersecurity, automation, systems</title>
<desc id="d">A binary trace encodes the motto "Every trace tells a story." and a reading head decodes it character by character.</desc>
<defs>
<style><![CDATA[
.t{font-weight:900}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.dc{font-size:11px;fill:#E6EDF3;text-anchor:middle;opacity:.34;animation:dc 10s linear infinite backwards}
@keyframes dc{0%{opacity:.34}1%{opacity:1}22%{opacity:1}42%{opacity:.34}100%{opacity:.34}}
.run{stroke-dasharray:60 2000;animation:run 10s linear infinite}
@keyframes run{0%{stroke-dashoffset:60}75%{stroke-dashoffset:-1000}100%{stroke-dashoffset:-1000}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dc{opacity:.8}.run{stroke-opacity:0}}
]]></style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#080B10"/></linearGradient>
<radialGradient id="gg" gradientUnits="userSpaceOnUse" cx="60" cy="0" r="430"><stop offset="0" stop-color="#39FF14" stop-opacity=".11"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></radialGradient>
<radialGradient id="gr" gradientUnits="userSpaceOnUse" cx="960" cy="280" r="400"><stop offset="0" stop-color="#FF3B5C" stop-opacity=".17"/><stop offset="1" stop-color="#FF3B5C" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1B222C" stroke-width="1"/></pattern>
<filter id="glow" x="-5%" y="-120%" width="110%" height="340%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="1000" height="280" rx="14"/></clipPath>
</defs>
